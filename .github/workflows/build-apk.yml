name: Build SARVCUT Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk Sarvcut.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sarvcut-APK
          path: Sarvcut.apk

      - name: Publish direct APK download in GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Sarvcut.apk --clobber || true
          else
            gh release create latest-apk Sarvcut.apk \
              --title "SARVCUT Android APK" \
              --notes "Download Sarvcut.apk directly and tap to install on Android." || true
          fi
